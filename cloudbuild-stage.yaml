steps:
  # Create lowercase branch name for GCP labels
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "${BRANCH_NAME,,}" > /workspace/branch_lower.txt
        cat /workspace/branch_lower.txt

  # Debug step: Show the values that will be used for build arguments
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Staging Build Arguments Debug ==="
        echo "BRANCH_NAME: ${BRANCH_NAME}"
        echo "_API_URL: ${_API_URL}"
        echo "_NEXT_PUBLIC_SOCKET_URL: ${_NEXT_PUBLIC_SOCKET_URL}"
        echo "_INSTAGRAM_SERVICE_URL: ${_INSTAGRAM_SERVICE_URL}"
        echo "Environment: STAGING"
        echo "=== End Debug ==="

  # Build the Docker image.
  #
  # --no-cache is REQUIRED here (do NOT reintroduce --cache-from / inline cache).
  # Reusing the cached `RUN npm run build` layer shipped a STALE Next.js bundle to
  # stage where a newly-added component (ScheduledFollowupsModal) imported
  # `proxyGet` from '@/lib/api' but the bundled module lacked that export, crashing
  # at runtime with "(0 , et.proxyGet) is not a function" even though the source
  # was correct. A clean build guarantees `next build` re-runs from scratch and the
  # emitted client chunks always match current source. Stage deploys are infrequent,
  # so paying for a full rebuild each time is an acceptable trade for correctness.
  # (The web/cloudbuild-stage.yaml sibling already builds with --no-cache.)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--no-cache',
      '-t', 'gcr.io/$PROJECT_ID/lad-frontend-stage:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/lad-frontend-stage:$SHORT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/lad-frontend-stage:$BRANCH_NAME',
      '-t', 'gcr.io/$PROJECT_ID/lad-frontend-stage:latest',
      '--build-arg', 'NEXT_PUBLIC_BACKEND_URL=$_API_URL',
      '--build-arg', 'NEXT_PUBLIC_ICP_BACKEND_URL=$_API_URL',
      '--build-arg', 'NEXT_PUBLIC_SOCKET_URL=$_NEXT_PUBLIC_SOCKET_URL',
      '--build-arg', 'NEXT_PUBLIC_WHATSAPP_API_URL=$_WABA_SERVICE_URL',
      '--build-arg', 'NEXT_PUBLIC_COMMS_SERVICE_URL=$_WABA_SERVICE_URL',
      '--build-arg', 'NEXT_PUBLIC_BNI_SERVICE_URL=$_CONVERSATION_SERVICE_URL',
      '--build-arg', 'NEXT_PUBLIC_DISABLE_VAPI=false',
      '--build-arg', 'NEXT_PUBLIC_PLAYGROUND_WORKER_URL=$_PLAYGROUND_WORKER_URL',
      '--build-arg', 'NEXT_PUBLIC_PLAYGROUND_TENANT_ID=$_PLAYGROUND_TENANT_ID',
      '--build-arg', 'NEXT_PUBLIC_PLAYGROUND_USER_ID=$_PLAYGROUND_USER_ID',
      '--build-arg', 'NEXT_PUBLIC_PLAYGROUND_TO_NUMBER=$_PLAYGROUND_TO_NUMBER',
      '--build-arg', 'NEXT_PUBLIC_PLAYGROUND_FROM_NUMBER=$_PLAYGROUND_FROM_NUMBER',
      '--build-arg', 'NEXT_PUBLIC_MAGE_API_URL=$_MAGE_API_URL',
      '--build-arg', 'NODE_ENV=production',
      '-f', 'Dockerfile',
      '.'
    ]

  # Push the Docker images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lad-frontend-stage:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lad-frontend-stage:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lad-frontend-stage:$BRANCH_NAME']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lad-frontend-stage:latest']

  # Deploy to Cloud Run — staging (lad-stage-484806)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BRANCH_LOWER=$(cat /workspace/branch_lower.txt)

        echo "=== Deploying with inline env vars ==="
        echo "API_URL: $_API_URL"
        echo "SOCKET_URL: $_NEXT_PUBLIC_SOCKET_URL"
        echo "WABA_URL: $_WABA_SERVICE_URL"
        echo "CONVERSATION_URL: $_CONVERSATION_SERVICE_URL"

        gcloud run deploy $_SERVICE_NAME \
          --image gcr.io/$PROJECT_ID/lad-frontend-stage:$COMMIT_SHA \
          --region $_REGION \
          --platform managed \
          --allow-unauthenticated \
          --port 3000 \
          --memory 2Gi \
          --cpu 2 \
          --min-instances 1 \
          --max-instances 10 \
          --concurrency 80 \
          --timeout 300 \
          --set-env-vars "^@@^NODE_ENV=production@@ENVIRONMENT=staging@@BRANCH=$BRANCH_NAME@@COMMIT_SHA=$SHORT_SHA@@BUILD_ID=$BUILD_ID@@NEXT_PUBLIC_BACKEND_URL=$_API_URL@@NEXT_PUBLIC_ICP_BACKEND_URL=$_API_URL@@BACKEND_INTERNAL_URL=$_API_URL@@API_BASE_URL=http://localhost:3000@@NEXT_PUBLIC_SOCKET_URL=$_NEXT_PUBLIC_SOCKET_URL@@NEXT_PUBLIC_DISABLE_VAPI=false@@NEXT_PUBLIC_WHATSAPP_API_URL=$_WABA_SERVICE_URL@@NEXT_PUBLIC_COMMS_SERVICE_URL=$_WABA_SERVICE_URL@@NEXT_PUBLIC_BNI_SERVICE_URL=$_CONVERSATION_SERVICE_URL@@BNI_SERVICE_URL=$_CONVERSATION_SERVICE_URL@@WABA_SERVICE_URL=$_WABA_SERVICE_URL@@WHATSAPP_SERVICE_URL=$_WABA_SERVICE_URL@@WAPA_SERVICE_URL=$_WAPA_SERVICE_URL@@INSTAGRAM_SERVICE_URL=$_INSTAGRAM_SERVICE_URL@@NEXT_PUBLIC_INSTAGRAM_API_URL=$_INSTAGRAM_SERVICE_URL@@NEXT_PUBLIC_PLAYGROUND_WORKER_URL=$_PLAYGROUND_WORKER_URL@@NEXT_PUBLIC_PLAYGROUND_TENANT_ID=$_PLAYGROUND_TENANT_ID@@NEXT_PUBLIC_PLAYGROUND_USER_ID=$_PLAYGROUND_USER_ID@@NEXT_PUBLIC_PLAYGROUND_TO_NUMBER=$_PLAYGROUND_TO_NUMBER@@NEXT_PUBLIC_PLAYGROUND_FROM_NUMBER=$_PLAYGROUND_FROM_NUMBER@@MASTER_AGENT_URL=$_MASTER_AGENT_URL@@NEXT_PUBLIC_MAGE_API_URL=$_MAGE_API_URL@@EMAIL_COMMS_SERVICE_URL=$_EMAIL_COMMS_SERVICE_URL" \
          --set-secrets LAD_MASTER_AGENT_SERVICE_TOKEN=lad-master-agent-service-token:latest \
          --update-labels environment=staging,branch=$${BRANCH_LOWER},commit-sha=$SHORT_SHA,managed-by=cloud-build

        echo "✅ Frontend deployment to $_SERVICE_NAME completed successfully"

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/lad-frontend-stage:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lad-frontend-stage:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/lad-frontend-stage:$BRANCH_NAME'
  - 'gcr.io/$PROJECT_ID/lad-frontend-stage:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: 'ALLOW_LOOSE'
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

# Timeout for the entire build
timeout: '1800s'

# Substitutions for Staging Environment
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'lad-frontend-stage'
  _ENV: 'staging'
  # Update these URLs after first deploy once you know the project number
  # Run: gcloud projects describe lad-stage-484806 --format='value(projectNumber)'
  _API_URL: 'https://lad-backend-stage-344049867257.us-central1.run.app'
  _NEXT_PUBLIC_SOCKET_URL: 'https://lad-backend-stage-344049867257.us-central1.run.app'
  _CONVERSATION_SERVICE_URL: 'https://bni-conversation-service-stage-344049867257.us-central1.run.app'
  # NOTE: lad-waba-comms-stage runs in asia-south1 (not us-central1). The
  # us-central1 service (lad-waba-comms-stage) is stale — last revision was
  # deployed 2026-05-12 and lacks newer endpoints like /api/broadcasts/*,
  # which causes 404s in the deployed frontend's WhatsApp proxy. The
  # asia-south1 service (lad-waba-comms-stage-asia) is the live deployment.
  _WABA_SERVICE_URL: 'https://lad-waba-comms-stage-asia-344049867257.asia-south1.run.app'
  # LAD-WAPA-Comms (Personal WhatsApp / Baileys) — proxied through Next at
  # /api/whatsapp-conversations/* when channel=personal, and also reached via
  # the path-aware rule for /api/personal-whatsapp/* (System Prompts, Chat
  # Settings personal). Without this var the frontend falls back to localhost
  # → ECONNREFUSED → 502 "Failed to connect to conversation service (backend)".
  _WAPA_SERVICE_URL: 'https://lad-wapa-comms-stage-asia-344049867257.asia-south1.run.app'
  # LAD-Instagram-Comms service URL — proxied through Next at
  # /api/instagram-conversations/*. Stage deploy in asia-south1.
  _INSTAGRAM_SERVICE_URL: 'https://lad-instagram-comms-stage-asia-344049867257.asia-south1.run.app'
  # LAD-Email-Comms (hosted-provider email broadcasts + groups/contacts) —
  # proxied through Next at /api/email-comms/*. Read server-side as
  # EMAIL_COMMS_SERVICE_URL; without it the proxy falls back to localhost:8000
  # → unreachable from Cloud Run → 502 on every email-comms call.
  _EMAIL_COMMS_SERVICE_URL: 'https://lad-email-comms-stage-asia-344049867257.asia-south1.run.app'
  _MASTER_AGENT_URL: 'https://lad-master-agent-stage-asia-344049867257.asia-south1.run.app'
  _PLAYGROUND_WORKER_URL: 'https://voag-stg-playground-worker-axxjxdzmbq-el.a.run.app'
  _PLAYGROUND_TENANT_ID: '926070b5-189b-4682-9279-ea10ca090b84'
  _PLAYGROUND_USER_ID: 'fe9d6368-ff1b-4133-952a-525d60d06cbe'
  _PLAYGROUND_TO_NUMBER: '+15555555555'
  _PLAYGROUND_FROM_NUMBER: '+15555555555'
  _MAGE_API_URL: ''

# Cloud Build trigger configuration (set in Cloud Console):
# - Source repository: LAD-Frontend
# - Branch filter   : ^stage$
# - Config file     : cloudbuild-stage.yaml
# - Approval        : optional (recommended for staging)
