# Mr LAD pre-commit hooks
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Secret scanning — uses the repo's .gitleaks.toml
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (no committed secrets)
        args: ["protect", "--staged", "--redact", "--config", ".gitleaks.toml"]

  # General hygiene — trailing whitespace, end-of-file, large-file guard
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-yaml
        args: ["--unsafe"]  # cloudbuild yaml uses custom tags
      - id: check-merge-conflict
